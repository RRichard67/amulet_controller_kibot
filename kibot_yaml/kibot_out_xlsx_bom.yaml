# KiBot output for generating Bill of Materials in XLSX format
# https://kibot.readthedocs.io/en/latest/configuration/outputs/bom.html

kibot:
  version: 1

outputs:
- name: @NAME@
  comment: '@COMMENT@'
  type: bom
  category: '@DIR@'
  dir: '@DIR@'
  options:
    format: XLSX
    pre_transform: 
      - _value_split
      - @FILT_PRE_TRANSFORM@
    count_smd_tht: true
    # KiCost (distributor pricing/specs) needs API keys in an untracked kicost_config_local.yaml
    # and is meant to run locally only via `kibot_launch.sh --costs`, not in CI. This plain XLSX
    # BOM output has it disabled so it works without any credentials.
    # distributors:
    #     - Mouser
    #     - Digi-Key
    #     - TME
    #     # - Arrow
    #     # - Farnell
    xlsx:
      title: 'Bill of Materials'
      datasheet_as_link: 'Datasheet'
      logo: false
      style: modern-blue
      kicost: false
      specs: false

    columns:
      - "Row"
      - "Quantity Per PCB"
      - "References"
      - "Value"
      - "Datasheet"
      - "Footprint"
      - "Description"
      - "manf"
      - "manf#"

...
definitions:
  NAME: xlsx_bom
  COMMENT: Bill of Materials in XLSX format
  DIR: Manufacturing/Assembly
  FILT_PRE_TRANSFORM: field_rename